name: CI

# Runs on every push and every pull request.
# Goal: catch "doesn't compile / doesn't build" before it reaches a deploy.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests are skipped for now: the only test is the Spring context-load
      # test, which needs a live Postgres + all env vars. When real tests
      # exist, replace with `./mvnw -B verify` plus a postgres service.
      - name: Build
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc -b typechecks, vite build catches import/asset errors
      - name: Typecheck and build
        run: npm run build
