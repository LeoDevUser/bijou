<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background-color: #111111; font-family: 'Georgia', serif; color: #ffffff; }
        .button {
            display: inline-block;
            padding: 14px 36px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .button:hover { background-color: #ffffff; color: #111111; }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #111111; font-family: 'Georgia', serif; color: #ffffff;">

    <!-- Outer wrapper -->
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #111111;">
        <tr>
            <td align="center" style="padding: 60px 20px 0 20px;">

                <!-- Inner container -->
                <table width="600" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; width: 100%; margin: 0 auto;">

                    <!-- Brand header -->
                    <tr>
                        <td align="center" style="padding-bottom: 50px;">
                            <h1 style="font-size: 22px; letter-spacing: 10px; text-transform: uppercase; margin: 0; font-weight: normal; color: #ffffff;">
                                BIJOU MONDE
                            </h1>
                        </td>
                    </tr>

                    <!-- Thin divider -->
                    <tr>
                        <td align="center" style="padding-bottom: 50px;">
                            <table width="60" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td style="border-top: 1px solid #888888; font-size: 0; line-height: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Welcome heading -->
                    <tr>
                        <td align="center" style="padding: 0 40px 24px 40px;">
                            <h2 style="font-size: 30px; font-weight: normal; font-style: italic; margin: 0; color: #ffffff;"
                                th:text="#{mail.welcome.greeting(${fullName})}">
                                Welcome
                            </h2>
                        </td>
                    </tr>

                    <!-- Body text -->
                    <tr>
                        <td align="center" style="padding: 0 60px 40px 60px;">
                            <p style="font-size: 15px; line-height: 1.8; color: #aaaaaa; margin: 0; text-align: center;"
                               th:text="#{mail.welcome.body}">
                                Your account is now active. We invite you to explore our latest collections,
                                where every piece tells a unique story of craftsmanship.
                            </p>
                        </td>
                    </tr>

                    <!-- CTA Button -->
                    <tr>
                        <td align="center" style="padding-bottom: 60px;">
                            <a href="https://bijou.mx" class="button"
                               style="display: inline-block; border: 1px solid #ffffff; color: #ffffff; padding: 14px 36px; text-decoration: none; text-transform: uppercase; letter-spacing: 3px; font-size: 11px; font-family: 'Georgia', serif;"
                               th:text="#{mail.welcome.cta}">
                                Shop Collection
                            </a>
                        </td>
                    </tr>

                    <!-- Thin divider -->
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <table width="60" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td style="border-top: 1px solid #333333; font-size: 0; line-height: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding-bottom: 50px;">
                            <p style="font-size: 10px; color: #555555; letter-spacing: 2px; text-transform: uppercase; margin: 0;">
                                &copy; 2026 BIJOU MONDE
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
