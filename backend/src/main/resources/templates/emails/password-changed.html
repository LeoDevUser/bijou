<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #111111; font-family: 'Georgia', serif; color: #ffffff;">

    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #111111;">
        <tr>
            <td align="center" style="padding: 60px 20px 0 20px;">
                <table width="600" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; width: 100%; margin: 0 auto;">

                    <!-- Brand header -->
                    <tr>
                        <td align="center" style="padding-bottom: 50px;">
                            <h1 style="font-size: 22px; letter-spacing: 10px; text-transform: uppercase; margin: 0; font-weight: normal; color: #ffffff;">
                                BIJOU MONDE
                            </h1>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td align="center" style="padding-bottom: 50px;">
                            <table width="60" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td style="border-top: 1px solid #888888; font-size: 0; line-height: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Lock icon -->
                    <tr>
                        <td align="center" style="padding-bottom: 24px;">
                            <div style="width: 48px; height: 48px; border: 1px solid #555555; border-radius: 50%; display: inline-block; line-height: 48px; text-align: center; font-size: 22px;">
                                &#128274;
                            </div>
                        </td>
                    </tr>

                    <!-- Greeting -->
                    <tr>
                        <td align="center" style="padding: 0 40px 24px 40px;">
                            <h2 style="font-size: 28px; font-weight: normal; font-style: italic; margin: 0; color: #ffffff;"
                                th:text="#{mail.password.greeting(${firstName})}">
                                Hello
                            </h2>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td align="center" style="padding: 0 60px 40px 60px;">
                            <p style="font-size: 15px; line-height: 1.8; color: #aaaaaa; margin: 0; text-align: center;"
                               th:text="#{mail.password.body}">
                                Your password was changed.
                            </p>
                        </td>
                    </tr>

                    <!-- Warning notice -->
                    <tr>
                        <td align="center" style="padding: 0 40px 40px 40px;">
                            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td style="background-color: #1e1200; border-left: 3px solid #b8860b; padding: 16px 20px;">
                                        <p style="font-size: 12px; color: #c8a84b; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 10px 0;">
                                            &#9888; <span th:text="#{mail.password.notice}">Security Notice</span>
                                        </p>
                                        <p style="font-size: 13px; color: #aaaaaa; margin: 0 0 12px 0; line-height: 1.6;"
                                           th:text="#{mail.password.noticeBody}">
                                            If you did not make this change, please contact us immediately.
                                        </p>
                                        <p style="font-size: 13px; color: #aaaaaa; margin: 0 0 8px 0; line-height: 1.6;"
                                           th:text="#{mail.password.contactInstruction}">
                                            Write to us at:
                                        </p>
                                        <p style="margin: 0 0 8px 0;">
                                            <a href="mailto:bijou.monde@hotmail.com"
                                               style="font-size: 13px; color: #c8a84b; text-decoration: none; letter-spacing: 1px;">
                                                bijou.monde@hotmail.com
                                            </a>
                                        </p>
                                        <p style="font-size: 12px; color: #777777; margin: 0; line-height: 1.6;"
                                           th:text="#{mail.password.contactInclude(${email})}">
                                            Please include your account email in your message.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <table width="60" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td style="border-top: 1px solid #333333; font-size: 0; line-height: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding-bottom: 50px;">
                            <p style="font-size: 10px; color: #555555; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 12px 0;">
                                &copy; 2026 BIJOU MONDE
                            </p>
                            <p style="font-size: 10px; color: #444444; margin: 0;">
                                <a href="https://bijou.mx/unsubscribe" style="color: #555555; text-decoration: underline; letter-spacing: 1px;">Unsubscribe</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
