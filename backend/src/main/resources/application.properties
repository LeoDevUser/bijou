spring.application.name=backend

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# create-drop locally (set in .env: wipe + reseed on every restart);
# defaults to update so a production deploy without DDL_AUTO can never wipe data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.mapper.accept-case-insensitive-enums=true
# Keep these ABOVE the per-type caps enforced in CloudinaryService (image 25MB,
# video 100MB). When Tomcat is the one to reject, it aborts the request while the
# browser is still sending the body — the browser reports ERR_HTTP2_PROTOCOL_ERROR
# and never sees the 413 — so our own check has to be the one that fires.
spring.servlet.multipart.max-file-size=110MB
spring.servlet.multipart.max-request-size=120MB
# Read the rest of an over-limit body instead of resetting the connection, so the
# 413 response actually reaches the client. Bounded rather than unlimited (-1) so a
# runaway body still gets cut off.
server.tomcat.max-swallow-size=150MB
spring.devtools.restart.trigger-file=.restart

# ── Auth ──────────────────────────────────────────────────────────────────────
# JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_PAGE, COOKIE_SECURE are read
# directly from environment variables by @Value — do not redefine them here
# (a self-referential property is a circular reference in Spring Framework 6.2+).

# ── Stripe ────────────────────────────────────────────────────────────────────
# Test and live credentials live side by side; the active set is chosen at runtime
# by AppSettings.stripeLiveMode (admin toggle). The legacy STRIPE_SECRET_KEY /
# STRIPE_WEBHOOK_SECRET vars still work as the test-mode defaults.
stripe.secret.key.test=${STRIPE_SECRET_KEY_TEST:${STRIPE_SECRET_KEY:}}
stripe.secret.key.live=${STRIPE_SECRET_KEY_LIVE:}
stripe.publishable.key.test=${STRIPE_PUBLISHABLE_KEY_TEST:}
stripe.publishable.key.live=${STRIPE_PUBLISHABLE_KEY_LIVE:}
stripe.webhook.secret.test=${STRIPE_WEBHOOK_SECRET_TEST:${STRIPE_WEBHOOK_SECRET:}}
stripe.webhook.secret.live=${STRIPE_WEBHOOK_SECRET_LIVE:}

# ── Email ─────────────────────────────────────────────────────────────────────
# Brevo HTTP API is the default path (AppSettings.smtpRelayEnabled seeds to true).
brevo.api.key=${BREVO_API_KEY}
spring.mail.sender=${MAIL_SENDER}

# SMTP fallback — only used when the relay is toggled off in admin settings.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

