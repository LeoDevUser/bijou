spring.application.name=backend

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.mapper.accept-case-insensitive-enums=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.devtools.restart.trigger-file=.restart

# ── Auth ──────────────────────────────────────────────────────────────────────
# JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_PAGE, COOKIE_SECURE are read
# directly from environment variables by @Value — do not redefine them here
# (a self-referential property is a circular reference in Spring Framework 6.2+).

# ── Stripe ────────────────────────────────────────────────────────────────────
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ── Email ─────────────────────────────────────────────────────────────────────
# Brevo HTTP API is the default path (AppSettings.smtpRelayEnabled seeds to true).
brevo.api.key=${BREVO_API_KEY}
spring.mail.sender=${MAIL_SENDER}

# SMTP fallback — only used when the relay is toggled off in admin settings.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Tax / FX ──────────────────────────────────────────────────────────────────
# These have code defaults; override only if you want different rates.
